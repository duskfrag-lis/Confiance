<section class="verify">
  <div class="verify__icon"><app-icon name="mail" [size]="36" /></div>

  <h1 class="verify__title">Revisa tu correo</h1>
  <p class="verify__text">
    Enviamos un enlace de verificación a
    <strong class="verify__email" [attr.title]="email()">{{ email() ?? 'tu correo' }}</strong>
  </p>
  <p class="verify__text">
    Ábrelo para activar tu cuenta. Si no lo ves, revisa la carpeta de spam.
  </p>

  @if (!stored()) {
    <div class="field verify__field">
      <label class="field__label" for="email">¿A qué correo te lo reenviamos?</label>
      <div class="input-wrap">
        <app-icon class="input-wrap__icon" name="mail" [size]="18" />
        <input
          id="email"
          type="email"
          [formControl]="typed"
          autocomplete="email"
          placeholder="nombre@correo.com"
        />
      </div>
    </div>
  }

  @if (feedback(); as f) {
    <div
      class="alert"
      [class.alert--success]="f.type === 'success'"
      [class.alert--error]="f.type === 'error'"
      [attr.role]="f.type === 'error' ? 'alert' : 'status'"
    >
      <app-icon [name]="f.type === 'success' ? 'circle-check' : 'triangle-alert'" [size]="20" />
      <span>{{ f.text }}</span>
    </div>
  }

  <div class="verify__actions">
    <button class="btn btn--primary" type="button" (click)="resend()" [disabled]="!canResend()">
      {{ label() }}
    </button>
    <a class="btn btn--outline" routerLink="/auth/iniciar-sesion">Ir a iniciar sesión</a>
  </div>
</section>

<div class="stack" [formGroup]="group()">
  <div class="row-2">
    <div class="field">
      <label class="field__label" for="nombres">Nombres</label>

      <div class="input-wrap" [class.is-invalid]="err('nombres')">
        <input
          id="nombres"
          type="text"
          formControlName="nombres"
          autocomplete="given-name"
          placeholder="Laura Marcela"
          maxlength="60"
          [attr.aria-invalid]="!!err('nombres')"
        />
      </div>

      <app-field-error [message]="err('nombres')" />
    </div>

    <div class="field">
      <label class="field__label" for="apellidos">Apellidos</label>

      <div class="input-wrap" [class.is-invalid]="err('apellidos')">
        <input
          id="apellidos"
          type="text"
          formControlName="apellidos"
          autocomplete="family-name"
          placeholder="Gómez Ríos"
          maxlength="60"
          [attr.aria-invalid]="!!err('apellidos')"
        />
      </div>

      <app-field-error [message]="err('apellidos')" />
    </div>
  </div>

  <div class="field">
    <label class="field__label" for="cedula">Cédula</label>

    <div class="input-wrap" [class.is-invalid]="err('cedula')">
      <input
        id="cedula"
        type="text"
        inputmode="numeric"
        formControlName="cedula"
        autocomplete="off"
        placeholder="1020304050"
        maxlength="10"
        [attr.aria-invalid]="!!err('cedula')"
      />
    </div>

    <app-field-error [message]="err('cedula')" />
  </div>

  <div class="field">
    <label class="field__label" for="telefono">Teléfono celular</label>

    <div class="input-wrap" [class.is-invalid]="err('telefono')">
      <span class="input-wrap__prefix">+57</span>
      <input
        id="telefono"
        type="tel"
        inputmode="tel"
        formControlName="telefono"
        autocomplete="tel-national"
        placeholder="300 123 4567"
        maxlength="12"
        [attr.aria-invalid]="!!err('telefono')"
      />
    </div>
    <app-field-error [message]="err('telefono')" />
  </div>

  <div class="field">
    <label class="field__label" for="email">Correo electrónico</label>

    <div class="input-wrap" [class.is-invalid]="err('email')">
      <app-icon class="input-wrap__icon" name="mail" [size]="18" />
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="ejemplo@correo.com"
        [attr.aria-invalid]="!!err('email')"
      />
    </div>

    <app-field-error [message]="err('email')" />
  </div>

  <div class="field">
    <label class="field__label" for="password">Contraseña</label>

    <div class="input-wrap" [class.is-invalid]="err('password')">
      <app-icon class="input-wrap__icon" name="lock" [size]="18" />
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="new-password"
        placeholder="Crea una contraseña"
        maxlength="20"
        aria-describedby="password-rules"
        [attr.aria-invalid]="!!err('password')"
      />

      <button
        type="button"
        class="icon-btn"
        (click)="showPassword.set(!showPassword())"
        [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        [attr.aria-pressed]="showPassword()"
      >
        <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
      </button>
    </div>

    <app-field-error [message]="err('password')" />

    <div class="meter">
      <div class="meter__bars" [attr.data-level]="level()">
        @for (i of bars; track i) {
          <span class="meter__bar" [class.is-on]="i < level()"></span>
        }
      </div>

      <span class="meter__label">{{ label() }}</span>
      <span class="meter__count">{{ password().length }}/20</span>
    </div>

    <ul class="rules" id="password-rules">
      @for (r of rules(); track r.key) {
        <li class="rule" [class.is-met]="r.met">
          <span class="rule__dot">
            @if (r.met) {
              <app-icon name="check" [size]="12" />
            }
          </span>

          {{ r.label }}
        </li>
      }
    </ul>
  </div>

  <div class="field">
    <label class="field__label" for="confirmPassword">Confirmar contraseña</label>

    <div class="input-wrap" [class.is-invalid]="err('confirmPassword')">
      <app-icon class="input-wrap__icon" name="lock" [size]="18" />
      <input
        id="confirmPassword"
        [type]="showConfirm() ? 'text' : 'password'"
        formControlName="confirmPassword"
        autocomplete="new-password"
        placeholder="Repite tu contraseña"
        maxlength="20"
        [attr.aria-invalid]="!!err('confirmPassword')"
      />
      <button
        type="button"
        class="icon-btn"
        (click)="showConfirm.set(!showConfirm())"
        [attr.aria-label]="showConfirm() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        [attr.aria-pressed]="showConfirm()"
      >
        <app-icon [name]="showConfirm() ? 'eye-off' : 'eye'" [size]="18" />
      </button>
    </div>

    <app-field-error [message]="err('confirmPassword')" />
  </div>
</div>

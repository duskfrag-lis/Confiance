server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Evidencias: hasta 5 fotos de 5 MB en una sola petición (HU-19).
  client_max_body_size 30m;

  # API en el mismo origen: las cookies de sesión son del mismo sitio y no hace falta CORS.
  # ^~ hace que esta ruta gane sobre la regla de caché de abajo (/api/media/*.webp va al backend).
  location ^~ /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos con hash en el nombre: caché larga.
  location ~* \.(?:js|css|woff2?|png|jpe?g|webp|svg|ico)$ {
    expires 30d;
    access_log off;
    try_files $uri =404;
  }

  # SPA: cualquier otra ruta la resuelve Angular.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
